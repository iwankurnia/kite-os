<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- "Bloom" (light): translucent petals opening around a glow, Windows 11 feel in KiteOS colours -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5F8FF"/><stop offset="1" stop-color="#DCE6FB"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#BFDBFE" stop-opacity=".95"/><stop offset="1" stop-color="#BFDBFE" stop-opacity="0"/></radialGradient>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB" stop-opacity=".95"/><stop offset="1" stop-color="#7DD3FC" stop-opacity=".55"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5" stop-opacity=".95"/><stop offset="1" stop-color="#A5B4FC" stop-opacity=".55"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity=".95"/><stop offset="1" stop-color="#C4B5FD" stop-opacity=".55"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6" stop-opacity=".95"/><stop offset="1" stop-color="#93C5FD" stop-opacity=".55"/></linearGradient><linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".95"/><stop offset="1" stop-color="#DDD6FE" stop-opacity=".55"/></linearGradient><linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0EA5E9" stop-opacity=".95"/><stop offset="1" stop-color="#BAE6FD" stop-opacity=".55"/></linearGradient><linearGradient id="g6" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1" stop-opacity=".95"/><stop offset="1" stop-color="#A5B4FC" stop-opacity=".55"/></linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1240" cy="590" r="520" fill="url(#glow)"/>
  <g transform="translate(1240 640)">
    <ellipse cx="0" cy="60" rx="420" ry="120" fill="#6366F1" opacity=".18" filter="url(#shadow)"/>
    <g filter="url(#soft)"><path d="M0 0 C 110 -78, 360 -92, 470 0 C 360 92, 110 78, 0 0 Z" transform="rotate(-150)" fill="url(#g0)"/><path d="M0 0 C 110 -78, 360 -92, 470 0 C 360 92, 110 78, 0 0 Z" transform="rotate(-115)" fill="url(#g1)"/><path d="M0 0 C 110 -78, 360 -92, 470 0 C 360 92, 110 78, 0 0 Z" transform="rotate(-80)" fill="url(#g2)"/><path d="M0 0 C 110 -78, 360 -92, 470 0 C 360 92, 110 78, 0 0 Z" transform="rotate(-45)" fill="url(#g3)"/><path d="M0 0 C 110 -78, 360 -92, 470 0 C 360 92, 110 78, 0 0 Z" transform="rotate(-10)" fill="url(#g4)"/><path d="M0 0 C 110 -78, 360 -92, 470 0 C 360 92, 110 78, 0 0 Z" transform="rotate(25)" fill="url(#g5)"/><path d="M0 0 C 110 -78, 360 -92, 470 0 C 360 92, 110 78, 0 0 Z" transform="rotate(60)" fill="url(#g6)"/></g>
    <circle r="26" fill="#FFFFFF" opacity=".85"/>
  </g>
</svg>