<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- "Coast": a shore at golden hour in orange and teal, low horizon. Original artwork; Unsplash's wallpaper
       section was the reference for subject and palette only. -->
