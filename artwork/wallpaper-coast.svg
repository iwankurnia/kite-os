  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e98a5b"/><stop offset="1" stop-color="#2d5f7c"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c79e"/><stop offset="1" stop-color="#d79a6e"/></linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff4d8"/><stop offset="0.4" stop-color="#ffd59a" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient></defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
