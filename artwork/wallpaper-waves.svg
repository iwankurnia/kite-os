<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- "Waves" (light): pastel sky with layered smooth hills, macOS feel -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDF4FF"/><stop offset=".55" stop-color="#E9EEFF"/><stop offset="1" stop-color="#DDE7FF"/></linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C7D2FE"/><stop offset="1" stop-color="#FBCFE8"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="w4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#312E81"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FDE68A" stop-opacity=".9"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1420" cy="360" r="190" fill="url(#sun)" opacity=".7"/>
  <g filter="url(#soft)">
    <path d="M0 640 C 380 540, 700 720, 1080 620 S 1700 520, 1920 600 V1080 H0 Z" fill="url(#w1)"/>
    <path d="M0 740 C 420 640, 760 820, 1160 720 S 1720 640, 1920 700 V1080 H0 Z" fill="url(#w2)" opacity=".9"/>
    <path d="M0 850 C 360 770, 800 930, 1200 830 S 1760 780, 1920 820 V1080 H0 Z" fill="url(#w3)" opacity=".85"/>
    <path d="M0 960 C 420 900, 820 1020, 1240 950 S 1760 910, 1920 940 V1080 H0 Z" fill="url(#w4)" opacity=".9"/>
  </g>
</svg>
