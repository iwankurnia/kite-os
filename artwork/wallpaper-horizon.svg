    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd8ff"/><stop offset="0.6" stop-color="#ffd9c2"/><stop offset="1" stop-color="#ffc0a8"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
