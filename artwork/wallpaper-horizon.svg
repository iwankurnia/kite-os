    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fffdf5"/><stop offset="0.5" stop-color="#fff3df" stop-opacity="0.85"/><stop offset="1" stop-color="#fff3df" stop-opacity="0"/></radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d95e0"/><stop offset="1" stop-color="#6b74cc"/></linearGradient>
