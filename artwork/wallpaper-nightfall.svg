    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ee6c8" stop-opacity="0"/><stop offset="0.5" stop-color="#2ee6c8"/><stop offset="1" stop-color="#4f9dff" stop-opacity="0.2"/></linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
