    <path d="M256 36 L404 186 L256 186 Z" fill="#7DD3FC"/><path d="M404 186 L256 420 L256 186 Z" fill="#6366F1"/>
    <path d="M256 420 L108 186 L256 186 Z" fill="#8B5CF6"/><path d="M108 186 L256 36 L256 186 Z" fill="#38BDF8"/>
  </g>
  <path d="M1540 432 C 1500 600, 1420 760, 1300 960" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2" fill="none"/>
</svg>
