<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Login "Night aurora": dark sky, aurora low on the right, away from the login box -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05081A"/><stop offset="1" stop-color="#151E4D"/></linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".4" stop-color="#2DD4BF"/><stop offset=".75" stop-color="#6366F1"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></linearGradient>
    <filter id="b" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="b2" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <path d="M700 900 C 1000 620, 1300 860, 1600 560 S 2000 420, 2100 480" stroke="url(#a1)" stroke-width="260" fill="none" filter="url(#b)" opacity=".85"/>
  <path d="M760 860 C 1040 640, 1320 820, 1620 560 S 2000 440, 2100 470" stroke="url(#a1)" stroke-width="50" fill="none" filter="url(#b2)" opacity=".7"/>
</svg>
