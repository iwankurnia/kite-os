    <path d="M0 -120 L-40 -170 M2 -140 L44 -190" stroke="#5b4636" stroke-width="8" stroke-linecap="round"/>
    <g fill="#6f9a63"><circle cx="0" cy="-230" r="90"/><circle cx="-70" cy="-190" r="62"/><circle cx="74" cy="-196" r="66"/><circle cx="-20" cy="-290" r="60"/><circle cx="50" cy="-270" r="56"/></g>
