<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- "Meadow": a lone tree on a soft green hill under a pale sky (light). Original artwork; Unsplash's wallpaper
       section was the reference for subject and palette only. -->
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f3ef"/><stop offset="1" stop-color="#e6ecdf"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c6a0"/><stop offset="1" stop-color="#7fa775"/></linearGradient>
  <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7dbbf"/><stop offset="1" stop-color="#aac79f"/></linearGradient></defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <path d="M0 800 C400 740 800 760 1200 790 C1500 812 1720 790 1920 770 L1920 1080 L0 1080 Z" fill="url(#hill2)"/>
  <path d="M0 900 C300 860 700 720 1180 700 C1500 690 1760 760 1920 800 L1920 1080 L0 1080 Z" fill="url(#hill)"/>
