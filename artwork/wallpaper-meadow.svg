  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M520 300 q14 -12 28 0 q14 -12 28 0"/><path d="M600 260 q10 -9 20 0 q10 -9 20 0"/></g>
