<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- "Aurora" (dark): northern-lights bands over a deep night sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B1F"/><stop offset="1" stop-color="#131B44"/></linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".35" stop-color="#2DD4BF"/><stop offset=".7" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818CF8" stop-opacity="0"/><stop offset=".5" stop-color="#C084FC"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></linearGradient>
    <filter id="b80" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="b30" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <path d="M-100 700 C 300 380, 700 820, 1100 520 S 1800 300, 2050 520" stroke="url(#a1)" stroke-width="220" fill="none" filter="url(#b80)" opacity=".9"/>
  <path d="M-100 640 C 350 420, 750 760, 1150 500 S 1800 340, 2050 500" stroke="url(#a1)" stroke-width="60" fill="none" filter="url(#b30)" opacity=".8"/>
  <path d="M200 420 C 600 260, 900 520, 1300 330 S 1900 200, 2100 300" stroke="url(#a2)" stroke-width="160" fill="none" filter="url(#b80)" opacity=".55"/>
  <g fill="#FFFFFF">
    <circle cx="180" cy="120" r="1.6" opacity=".7"/><circle cx="420" cy="230" r="1.2" opacity=".5"/><circle cx="760" cy="90" r="1.4" opacity=".6"/>
    <circle cx="1040" cy="180" r="1.1" opacity=".5"/><circle cx="1380" cy="110" r="1.7" opacity=".7"/><circle cx="1660" cy="210" r="1.2" opacity=".5"/>
    <circle cx="1820" cy="80" r="1.4" opacity=".6"/><circle cx="560" cy="60" r="1" opacity=".4"/><circle cx="1220" cy="260" r="1" opacity=".4"/>
    <circle cx="300" cy="300" r="1" opacity=".35"/><circle cx="900" cy="300" r="1.2" opacity=".35"/><circle cx="1540" cy="320" r="1" opacity=".35"/>
