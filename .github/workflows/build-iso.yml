name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck libxml2-utils python3-yaml \
            plymouth-themes xfce4-settings e2fsprogs python3-gi gir1.2-gdkpixbuf-2.0
      - name: Tests
        run: sudo tests/run-all.sh

  iso:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write    # attach the ISO to the release on tag pushes
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build
        run: |
          case "$GITHUB_REF" in refs/tags/v*) export KITE_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          sudo -E ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kiteos-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
      # On a v* tag, the ISO goes straight onto the GitHub release from here, so
      # it never has to be downloaded and uploaded again by hand. A release made
      # beforehand (gh release create vX.Y --notes-file ...) keeps its notes and
      # gets the files; otherwise the release is created with generated notes.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          name="kiteos-${TAG#v}-amd64.iso"
          sudo mv kiteos-*-amd64.iso "$name"
          sudo rm -f -- *.sha256
          sha256sum "$name" | sudo tee "$name.sha256"
          # The KiteOS packages too (kite-docklike, the patched taskbar plugin,
          # included), for kite-update on installed systems.
          (cd debs && sha256sum kite-*.deb) | sudo tee kite-packages.sha256
          files="$name $name.sha256 kite-packages.sha256 $(ls debs/kite-*.deb)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --verify-tag \
              --title "KiteOS ${TAG#v}" --generate-notes
          fi

  # Once the release has its ISO, boot it in QEMU, install it and check the
  # installed system (tests/vm/ci-vm-test.sh, ~10 min). Screenshots and
  # report.md are on the run page; a failed check fails this job, not the release.
  vm-test:
    needs: iso
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/vm-test.yml
    with:
      tag: ${{ github.ref_name }}
