name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck libxml2-utils python3-yaml \
            plymouth-themes xfce4-settings e2fsprogs
      - name: Tests
        run: sudo tests/run-all.sh

  iso:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build
        run: sudo ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kiteos-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
