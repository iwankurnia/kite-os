name: VM test

# Boots a released ISO in QEMU with KVM (GitHub's Linux runners have it),
# installs it, boots the installed system and checks it.
# Screenshots, logs and report.md are attached to the run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v1.3.1)
        required: true
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            imagemagick tesseract-ocr xorriso
      - name: Download the ISO
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p iso && cd iso
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'kiteos-*-amd64.iso' -p 'kiteos-*-amd64.iso.sha256'
          sha256sum -c ./*.sha256
      - name: Run the VM test
        run: |
          rc=0
          tests/vm/ci-vm-test.sh iso/kiteos-*-amd64.iso vm-out || rc=$?
          cat vm-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-${{ inputs.tag }}
          path: |
            vm-out/*.png
            vm-out/*.md
            vm-out/*.log
            vm-out/*.txt
          if-no-files-found: warn
