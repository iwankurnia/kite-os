<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- KiteOS installer icon: the "Facets" kite with an install badge (from logo.svg) -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="l" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-width="10">
    <path d="M256 36 L404 186 L256 186 Z" fill="url(#t)" stroke="url(#t)"/>
    <path d="M404 186 L256 420 L256 186 Z" fill="url(#r)" stroke="url(#r)"/>
    <path d="M256 420 L108 186 L256 186 Z" fill="url(#b)" stroke="url(#b)"/>
    <path d="M108 186 L256 36 L256 186 Z" fill="url(#l)" stroke="url(#l)"/>
  </g>
  <path d="M256 424 C 226 450, 292 462, 258 490" fill="none" stroke="url(#tail)" stroke-width="12" stroke-linecap="round"/>
  <!-- Install badge: a download arrow on a white disc, so "Install KiteOS"
       is not the same picture as the kite menu button -->
  <circle cx="396" cy="396" r="104" fill="#ffffff"/>
  <circle cx="396" cy="396" r="88" fill="#16A34A"/>
  <path d="M396 338 L396 430 M356 394 L396 434 L436 394" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M352 456 L440 456" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
</svg>
