# KiteOS: make the layout picked on the "Desktop" page the default for the
# installed system's accounts. Calamares 3.3 stores the choice as
# packagechooser_<instance id> (the id in settings.conf, "kitelayout"); the
# "id:" in packagechooser-kite-layout.conf is ignored there. In 1.3.0 the
# instance was "kite-layout", so the key never matched and nothing ran.
---
dontChroot: false
timeout: 30
packagechooser_kitelayout:
    windows: "/usr/bin/kite-layout --system windows"
    mac: "/usr/bin/kite-layout --system mac"
