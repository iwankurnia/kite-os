# KiteOS: keep the live session's keyboard (US, as on the HP Chromebook 11 G8
# EE) instead of guessing one from the language: British English would pick
# the UK layout, which swaps " and @ and moves # and \ on a US keyboard.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
guessLayout: false
configure:
    kwin: false
