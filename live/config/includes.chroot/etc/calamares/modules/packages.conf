---
# Remove the live session and the installer itself from the installed system.
backend: apt
operations:
  - try_remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
      - 'calamares'
      - 'user-setup'
      - 'squashfs-tools'
      - 'qml6-module-qtquick'
      - 'qml6-module-qtquick-window'
