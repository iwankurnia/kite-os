---
displaymanagers:
  - lightdm
defaultDesktopEnvironment:
    executable: "startxfce4"
    desktopFile: "xfce"
basicSetup: false
sysconfigSetup: false
# The login screen is lightdm-gtk-greeter (it shares its look with the lock
# screen). Without this, Calamares writes the first greeter it finds into
# /etc/lightdm/lightdm.conf, which overrides lightdm.conf.d (until KiteOS 1.3
# that was slick-greeter).
lightdm:
    preferred_greeters: ["lightdm-gtk-greeter.desktop"]
