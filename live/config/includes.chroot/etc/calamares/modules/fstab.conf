---
# Calamares 3.3 format. Mount options (noatime, the ESP umask) are in
# mount.conf now; Calamares 3.3 ignores a mountOptions key here.
crypttabOptions: luks,keyscript=/bin/cat
# /tmp in RAM on the eMMC (Calamares treats it as an SSD).
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
