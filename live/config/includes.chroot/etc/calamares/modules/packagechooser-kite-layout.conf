# KiteOS: choose the desktop layout. Nothing is installed here: the choice is
# stored in Calamares' global storage as packagechooser_kitelayout and applied
# by contextualprocess@kite-layout (kite-layout --system <choice>).
---
mode: required
method: legacy
id: kitelayout
labels:
    step: "Desktop"
default: windows
items:
    - id: windows
      name: "Windows style"
      description: "A taskbar at the bottom with the Start menu, search and your apps on the left. Fluent theme and Papirus icons. You can switch later with kite-layout."
      screenshot: "/usr/share/kite/layouts/windows.png"
    - id: mac
      name: "Mac style"
      description: "A menu bar at the top and a Dock at the bottom. Qogir theme and icons. You can switch later with kite-layout."
      screenshot: "/usr/share/kite/layouts/mac.png"
