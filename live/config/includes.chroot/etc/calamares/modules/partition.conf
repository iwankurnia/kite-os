---
# KiteOS: GPT + EFI system partition + one ext4 root. No swap partition:
# the installer creates a swap file big enough for hibernation instead
# (resizable later, and no wasted partition on a 32 GB eMMC).
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"
userSwapChoices:
    - none
initialSwapChoice: none
luksGeneration: luks1
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
defaultPartitionTableType: gpt
defaultFileSystemType:  "ext4"
availableFileSystemTypes:  ["ext4"]
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
