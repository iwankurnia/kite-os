# KiteOS installer — based on calamares-settings-debian 13 with two extra
# KiteOS jobs (hibernation swap file, live-session cleanup).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       kite-hibernate
  module:   shellprocess
  config:   shellprocess-kite-hibernate.conf
- id:       kite-finish
  module:   shellprocess
  config:   shellprocess-kite-finish.conf
- id:       kite-layout
  module:   packagechooser
  config:   packagechooser-kite-layout.conf
- id:       kite-layout
  module:   contextualprocess
  config:   contextualprocess-kite-layout.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@kite-layout
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  # KiteOS: swap file sized for hibernation + resume= config (before GRUB
  # and the initramfs are generated below).
  - shellprocess@kite-hibernate
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - luksbootkeyfile
  - plymouthcfg
  - initramfscfg
  - initramfs
  - contextualprocess@kite-layout
  - shellprocess@kite-finish
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: kite
prompt-install: true
dont-chroot: false
