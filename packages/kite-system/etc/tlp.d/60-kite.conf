# KiteOS power settings for TLP (Debian's tlp 1.8; read after tlp.conf).
# TLP switches them when the charger is plugged in or out (its udev rule).
# On battery KiteOS saves hard ("strong"); "Full speed on battery" in
# Settings > Battery (kite-power full) uses the plugged-in settings instead,
# until it is switched off or the laptop restarts. What TLP does not do
# (P/E-core placement, the Intel GPU's top speed) is done by
# /usr/sbin/kite-power. On low-end CPUs (no P/E cores, 4 logical CPUs or
# fewer, like the N4020) kite-power adds 61-kite-boost.conf, which keeps the
# boost on battery. tlp-stat shows what is in force.

# No battery at all (a desktop, a VM): plugged-in settings.
TLP_DEFAULT_MODE=AC

# --- CPU ---------------------------------------------------------------------
# Energy/performance preference (EPP, Intel intel_pstate with HWP or AMD
# amd-pstate-epp; EPB on older Intel): the CPU's own power management
# decides how eagerly to raise the clock. "power" on battery keeps it low
# and, on CPUs with P- and E-cores, steers work to the E-cores (Thread
# Director).
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
# Turbo / boost above the base clock: off on battery. On the Chromebook's
# Celeron N4020 that caps the clock at its 1.1 GHz base (2.8 GHz with turbo):
# slower on heavy pages, far less power and heat.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
# Intel's dynamic boost (raises the clock after waiting for I/O): off on battery.
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
# ACPI platform profile, where the firmware has one (fans, power limits);
# the Chromebook has none.
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power
# Kernel NMI watchdog: off (debugging only; wakes every CPU regularly).
NMI_WATCHDOG=0

# --- PCI Express and runtime power management (drivers) -----------------------
# Link power states: deepest ("powersupersave", L1 substates) on battery.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
# Let every PCI device's driver power it down while idle (Wi-Fi, the eMMC
# and SD controllers, audio, USB controllers...) on battery.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# --- USB -------------------------------------------------------------------------
# Suspend idle USB devices (webcam, card reader, sticks...). TLP leaves
# input devices (keyboard, touchpad, mouse), audio devices and printers alone.
USB_AUTOSUSPEND=1
# The Bluetooth adapter is on USB: leave it awake, so Bluetooth headphones
# do not drop out.
USB_EXCLUDE_BTUSB=1

# --- Radios ------------------------------------------------------------------------
# Wi-Fi power saving (the adapter sleeps between beacons) on battery.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
# Bluetooth off when unplugging, if nothing is connected (turn it on again
# from the tray when you need it; plugging in does not switch it back on).
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth"
WOL_DISABLE=Y

# --- Audio and storage ----------------------------------------------------------------
# HD-audio power saving (laptops with Intel HDA; the Chromebook's SOF audio
# powers down by itself).
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
# Write changed files to the eMMC every 60 s on battery, 15 s plugged in
# (fewer wake-ups; at most a minute of unsaved work lost in a crash).
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60
