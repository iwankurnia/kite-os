# zswap keeps swapped-out pages compressed in RAM and only writes them to the
# (slow) eMMC swap file when its pool is full. Read at boot by kite-zswap.service.
ENABLED=1
# zstd: best ratio (good for 4 GB RAM). lz4: a little faster, compresses less.
COMPRESSOR=zstd
ZPOOL=zsmalloc
# Upper limit of RAM the compressed pool may use.
MAX_POOL_PERCENT=25
SHRINKER=1
