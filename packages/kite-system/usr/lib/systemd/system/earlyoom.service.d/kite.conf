# When RAM and swap are both nearly exhausted, end the biggest browser/office
# process instead of letting the whole desktop freeze.
[Service]
Environment="KITE_EARLYOOM_ARGS=-m 4 -s 10 -r 3600 --avoid ^(Xorg|xfwm4|xfce4-session|xfce4-panel|lightdm|systemd|pipewire|wireplumber|keyd)$ --prefer ^(brave|DesktopEditors|editors)$"
ExecStart=
ExecStart=/usr/bin/earlyoom $KITE_EARLYOOM_ARGS
