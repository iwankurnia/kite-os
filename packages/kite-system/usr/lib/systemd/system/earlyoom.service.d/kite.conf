# When RAM and swap are both nearly exhausted, end the biggest browser/office
# process instead of letting the whole desktop freeze. The swap floor comes
# from kite-hibernate-setup (/etc/kite/earlyoom.env): it keeps the room to
# hibernate free; 10 % where hibernation is not set up.
[Service]
Environment=KITE_EARLYOOM_SWAP=10
EnvironmentFile=-/etc/kite/earlyoom.env
Environment="KITE_EARLYOOM_ARGS=-m 4 -r 3600 --avoid ^(Xorg|xfwm4|picom|xfce4-session|xfce4-panel|lightdm|systemd|pipewire|wireplumber|keyd)$ --prefer ^(brave|DesktopEditors|editors)$"
ExecStart=
ExecStart=/usr/bin/earlyoom -s ${KITE_EARLYOOM_SWAP} $KITE_EARLYOOM_ARGS
