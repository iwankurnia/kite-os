# KiteOS: the kernel's multi-generational LRU, as on ChromeOS. min_ttl_ms
# keeps whatever was used in the last second (the desktop's code while you
# move the pointer or switch windows) in memory; when that is not possible
# the out-of-memory killer ends the biggest app (Brave's tabs first) instead
# of the whole laptop crawling while pages go back and forth to the eMMC.
w- /sys/kernel/mm/lru_gen/enabled - - - - y
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
