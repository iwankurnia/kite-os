# KiteOS memory tuning for 4 GB RAM + eMMC.
# Swapping goes to zswap (compressed RAM) first, so it is cheap: prefer it
# over throwing away file cache that would have to be re-read from eMMC.
vm.swappiness = 100
# Start writing dirty pages back earlier; avoids long stalls on slow eMMC.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
