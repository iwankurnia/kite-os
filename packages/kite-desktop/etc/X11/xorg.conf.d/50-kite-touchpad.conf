# KiteOS touchpad defaults (libinput): tap to click and natural (content-
# follows-fingers) scrolling, like ChromeOS. Each user can still change them
# in Settings > Mouse and Touchpad.
Section "InputClass"
    Identifier "KiteOS touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
EndSection
