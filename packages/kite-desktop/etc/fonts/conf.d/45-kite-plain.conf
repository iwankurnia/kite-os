<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- "KiteOS Plain": Inter at regular weight and upright, whatever weight or
     slant is asked for. The taskbar's window pop-up (docklike) writes the
     focused window's title in bold and minimised ones in italics with Pango
     markup, which CSS cannot override; gtk.css gives those titles this font
     instead, so they all look the same. Nothing else uses this name. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>KiteOS Plain</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign"><const>regular</const></edit>
    <edit name="slant" mode="assign"><const>roman</const></edit>
  </match>
</fontconfig>
