# Colour saturation of the built-in screen, applied at login by kite-vivid.
# The Chromebook's TN panel looks washed out; 1.2 gives a subtle "vivid" look
# (like BlackBerry's vivid mode). 1.0 = normal colours, 1.3+ = stronger
# (skin tones start to look orange). Users can override it with
# "kite-vivid <level>" (saved in ~/.config/kite/vivid.conf).
SATURATION=1.2

# Window and menu animations with soft shadows (picom, /etc/kite/picom.conf).
# 0 = off: xfwm4's own compositor is used instead (shadows, no animations).
# Per user: ~/.config/kite/display.conf.
ANIMATIONS=1

