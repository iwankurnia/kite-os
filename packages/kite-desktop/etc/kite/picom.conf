# KiteOS compositor (picom 12): calm, short animations and soft shadows.
# Started by /usr/lib/kite/desktop/start-compositor at login instead of
# xfwm4's own compositor; if picom can't run, xfwm4's takes over again.
# Turn animations off with ANIMATIONS=0 in /etc/kite/display.conf
# (or ~/.config/kite/display.conf for one user).
#
# The rules, so nothing looks odd: every animation is short (under 0.16 s),
# windows only grow from 96 %, the calendar, menus and tooltips only fade,
# the taskbar and desktop never move, and nothing animates while a window is
# resized, maximised or tiled (picom would stretch its old picture). KiteOS
# Start is the exception: it rises as it fades in and its folders zoom from 85 %.

# xrender, not glx: with glx, a taskbar started while picom runs (after
# "kite-layout desktop" or "keys", or a panel crash) stayed invisible until
# picom restarted (xfwm4 puts the panel in a 32-bit frame; seen 2026-11-25,
# every time, with picom 12.5). xrender showed it every time and draws the
# same animations and shadows; X's glamor acceleration runs it on the GPU.
backend = "xrender";
vsync = true;
use-damage = true;
# A full-screen window (video, a game) bypasses the compositor: smoother and
# lighter on the CPU.
unredir-if-possible = true;

# Shadows like xfwm4's under the KiteOS layout: soft, a 3 px drop, under
# windows (the Start menu and calendar included), not under the taskbar, the
# desktop, menus or tooltips (those have a thin border from gtk.css instead).
# Matched to xfwm4's own shadow by measurement (2026-11-25, xrender: 48/37/23/
# 11/3 levels darker at 3/6/10/15/20 px below a window, xfwm4 50/39/26/12/2).
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.70;
shadow-offset-x = -22;
shadow-offset-y = -19;

fading = false;          # the animations below fade as well

# Windows: fade in while growing from 96 %, fade out while shrinking to 96 %.
# The same for minimise and restore.
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.15; scale = 0.96; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.12; scale = 0.96; }
);

rules = (
  # Panel pop-ups (the Start menu, the clock's calendar, plugin windows):
  # fade only.
  { match = "class_g = 'Wrapper-2.0'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.12; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; scale = 1.0; }
    );
  },
  # Notifications: fade only.
  { match = "window_type = 'notification'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.15; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.12; scale = 1.0; }
    );
  },
  # Menus and tooltips: a very quick fade, no shadow.
  { match = "override_redirect || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'tooltip' || window_type = 'combo'";
    shadow = false;
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.08; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.06; scale = 1.0; }
    );
  },
  # The taskbar's window pop-up (docklike: hover an app with open windows),
  # an override-redirect "normal" window of the panel's plugin process: a
  # card with rounded corners and a soft shadow, like Windows 11's, fading
  # in. GTK cannot round it (no alpha channel), so picom does.
  { match = "override_redirect && class_g = 'Wrapper-2.0' && window_type = 'normal'";
    shadow = true;
    corner-radius = 8;
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.12; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; scale = 1.0; }
    );
  },
  # KiteOS Start (kite-start, a pop-up-menu window): a card with a soft
  # shadow that rises and fades in above the taskbar, like Windows 11's
  # Start menu, and just fades out when it closes.
  # (Not its right-click menus: override-redirect windows of the same class.)
  { match = "class_g = 'Kite-start' && !override_redirect && name != 'kite-start-folder'";
    shadow = true;
    corner-radius = 10;
    animations = (
      # Opening: rises 48 px while it fades in, easing out; closing: fades out.
      { triggers = [ "open", "show" ];
        offset-y = { duration = 0.14; start = 48; end = 0; curve = "cubic-bezier(0.2, 0.8, 0.3, 1)"; };
        shadow-offset-y = "offset-y";
        opacity = { duration = 0.14; start = 0; end = "window-raw-opacity"; };
        shadow-opacity = "opacity";
      },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; scale = 1.0; }
    );
  },
  # A folder opened in KiteOS Start: zooms in from 85 % and back out. It
  # draws its own rounded corners and a lighter shadow than picom's.
  { match = "name = 'kite-start-folder'";
    shadow = false;
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.15; scale = 0.85; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.12; scale = 0.85; }
    );
  },
  # KiteOS window switcher (Alt+Tab): draws its own shadow round its card,
  # so none from picom; a quick fade.
  { match = "name = 'kite-switcher'";
    shadow = false;
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.08; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.06; scale = 1.0; }
    );
  },
  # KiteOS overview (Search+W, three-finger swipe): it animates its own
  # opening; picom only fades it out when it closes; no picom shadow. It
  # covers the screen, so it would bypass picom (unredir-if-possible) and
  # close with no fade-out: unredir = false keeps it composited.
  { match = "name = 'kite-overview'";
    shadow = false;
    unredir = false;
    animations = (
      # nothing from picom when it opens: the overview animates its own
      # contents (search bar and tiles zoom in from 60 %, wallpaper fades in)
      { triggers = [ "open", "show" ]; var-none = 0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.15; scale = 1.0; }
    );
  },
  # The taskbar and the desktop: still, no shadow.
  { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; animations = (); },
  # Full-screen windows: no shadow.
  { match = "fullscreen"; shadow = false; },
  # Windows that draw their own frame and shadow in a transparent margin
  # (_GTK_FRAME_EXTENTS: Brave, GTK header-bar apps): picom's shadow round the
  # whole window would outline the invisible margin, so Brave looked framed
  # in a pale box with a hard edge (2026-11-25). picom 12.5 applies this to
  # windows opened after it starts; one already open when picom (re)starts
  # keeps picom's shadow until it is minimised and restored, because picom
  # checks its rules before it has read that window's properties.
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; }
);
