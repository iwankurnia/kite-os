# KiteOS compositor (picom 12): short animations and soft shadows.
# Started by /usr/lib/kite/desktop/start-compositor from the X session start-up
# (before the shelf appears, so it can fade in) instead of xfwm4's compositor; if picom can't run, xfwm4's takes over again.
# Turn animations off with ANIMATIONS=0 in /etc/kite/display.conf
# (or ~/.config/kite/display.conf for one user).

backend = "glx";
vsync = true;
use-damage = true;

# Soft shadows, also under the shelf and round the launcher's rounded corners.
# Strong enough to read on the light theme; centred with a 4 px drop.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.32;
shadow-offset-x = -18;
shadow-offset-y = -14;

fading = false;          # the animations below fade as well

# Every window: grows in on open, shrinks away on close, glides on move/resize.
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.16; scale = 0.94; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.12; scale = 0.94; },
  { triggers = [ "geometry" ];      preset = "geometry-change"; duration = 0.16; }
);

rules = (
  # The launcher menu fades in and out (no zoom), with a shadow rounded to
  # its 16 px corners.
  { match = "class_g = 'Rofi'";
    shadow = true;
    corner-radius = 16;
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.15; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.12; scale = 1.0; }
    );
  },
  # The shelf fades in when the session starts, with its shadow along the top.
  { match = "window_type = 'dock'";
    shadow = true;
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.3; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.15; scale = 1.0; }
    );
  },
  # Menus, tooltips and notifications: a quick fade, no zoom.
  { match = "window_type = 'tooltip' || window_type = 'notification' || window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.10; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.08; scale = 1.0; }
    );
  },
  # No shadow behind the desktop background or full-screen windows (video).
  { match = "window_type = 'desktop' || fullscreen"; shadow = false; }
);
