# KiteOS compositor (picom 12): short animations and soft shadows.
# Started by /usr/lib/kite/desktop/start-compositor from the X session start-up
# (before the shelf appears, so it can fly in) instead of xfwm4's compositor; if picom can't run, xfwm4's takes over again.
# Turn animations off with ANIMATIONS=0 in /etc/kite/display.conf
# (or ~/.config/kite/display.conf for one user).

backend = "glx";
vsync = true;
use-damage = true;

# Soft shadows, also under the shelf and round the launcher's rounded corners.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.22;
shadow-offset-x = -12;
shadow-offset-y = -9;

fading = false;          # the animations below fade as well

# Every window: grows in on open, shrinks away on close, glides on move/resize.
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.16; scale = 0.94; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.12; scale = 0.94; },
  { triggers = [ "geometry" ];      preset = "geometry-change"; duration = 0.16; }
);

rules = (
  # The launcher menu flies in from below the screen and back out to it.
  # It sits 56 px above the screen's bottom edge (44 px shelf + 12 px gap),
  # so it travels its own height + 56 px; the curves are picom's fly-in and
  # fly-out presets (whose distance would leave its top showing).
  { match = "class_g = 'Rofi'";
    corner-radius = 16;
    animations = (
      { triggers = [ "open", "show" ];
        offset-y = { curve = "cubic-bezier(0.17, 0.67, 0.68, 1.03)"; duration = 0.2;
                     start = "window-height + 56"; end = 0; };
        shadow-offset-y = "offset-y";
      },
      { triggers = [ "close", "hide" ];
        offset-y = { curve = "cubic-bezier(0.05, 0, 0.69, -0.05)"; duration = 0.16;
                     start = 0; end = "window-height + 56"; };
        shadow-offset-y = "offset-y";
        opacity = { start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; duration = 0.16; };
        shadow-opacity = "opacity";
      }
    );
  },
  # The shelf flies in from the bottom when the session starts (and out if it
  # is restarted). It is at the very bottom, so the preset's distance (its own
  # 44 px height) is exactly off-screen.
  { match = "window_type = 'dock'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "fly-in";  direction = "down"; duration = 0.35; },
      { triggers = [ "close", "hide" ]; preset = "fly-out"; direction = "down"; duration = 0.2; }
    );
  },
  # Menus, tooltips and notifications: a quick fade, no zoom.
  { match = "window_type = 'tooltip' || window_type = 'notification' || window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.10; scale = 1.0; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.08; scale = 1.0; }
    );
  },
  # No shadow behind the desktop background or full-screen windows (video).
  { match = "window_type = 'desktop' || fullscreen"; shadow = false; }
);
