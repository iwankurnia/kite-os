# Extra command-line flags for Brave, added by /usr/bin/brave-browser-stable
# (a KiteOS wrapper). Your own flags go in ~/.config/brave-flags.conf.
# One or more flags per line; lines starting with # are ignored.

# Hardware video decoding through VA-API (intel-media-va-driver) on X11.
# The N4020 decodes H.264, HEVC and VP9 in hardware, but not AV1.
# Check it in brave://gpu ("Video Decode: Hardware accelerated") and, while a
# video plays, in brave://media-internals (kVideoDecoderName: VaapiVideoDecoder).
# To turn it off, put # in front of the next line.
--enable-features=AcceleratedVideoDecodeLinuxGL

# Faster, but has caused corrupted frames on some Intel GPUs. Try it on the
# device and keep it only if videos look right:
#--enable-features=AcceleratedVideoDecodeLinuxZeroCopyGL
