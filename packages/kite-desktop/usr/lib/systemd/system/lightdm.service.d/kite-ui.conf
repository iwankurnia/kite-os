# KiteOS: keep the X server (it draws the pointer and every window) in memory
# when memory runs low: protected from reclaim up to 256 MiB and never
# swapped out. The login session itself is not in this unit (its own scope).
# Needs the same protection on system.slice (system.slice.d/kite-ui.conf).
[Service]
MemoryLow=256M
MemorySwapMax=0
