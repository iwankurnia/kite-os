# KiteOS login screen (lightdm-gtk-greeter). Sorts after Debian's
# 01_debian.conf. The background is changed with kite-login-theme or
# Settings > Login Screen, which write /etc/lightdm/lightdm-gtk-greeter.conf.d/.
[greeter]
background=/usr/share/backgrounds/kite/login-frosted.jpg
user-background=false
theme-name=KiteOS-Login
icon-theme-name=Papirus-Light
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
cursor-theme-name=Adwaita
indicators=~spacer;~clock;~spacer;~power
clock-format=%a %-d %b   %H:%M
round-user-image=true
position=50%,center 50%,center
panel-position=top
screensaver-timeout=60
